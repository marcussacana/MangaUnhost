name: Build MangaUnhost

on:
  push:
    branches:
      - master-dotnet10
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Determine Next Version
      id: versioning
      shell: bash
      run: |
        NEXT_VERSION="10.0.0"
        HTTP_STATUS=$(curl -s -o temp_update.ini -w "%{http_code}" https://raw.githubusercontent.com/marcussacana/MangaUnhost/data/update.ini)
        if [ "$HTTP_STATUS" -eq 200 ]; then
          CUR_VER=$(grep -i "^Version=" temp_update.ini | cut -d'=' -f2 | tr -d '\r')
          if [[ "$CUR_VER" =~ ^10\.0\.([0-9]+)$ ]]; then
            PATCH_VER=${BASH_REMATCH[1]}
            NEXT_PATCH=$((PATCH_VER + 1))
            NEXT_VERSION="10.0.${NEXT_PATCH}"
          fi
        fi
        echo "Next Version: $NEXT_VERSION"
        echo "VERSION=$NEXT_VERSION" >> $GITHUB_ENV
        sed -i "s/AssemblyVersion(\".*\")/AssemblyVersion(\"$NEXT_VERSION.0\")/g" MangaUnhost/Properties/AssemblyInfo.cs
        sed -i "s/AssemblyFileVersion(\".*\")/AssemblyFileVersion(\"$NEXT_VERSION.0\")/g" MangaUnhost/Properties/AssemblyInfo.cs
        rm -f temp_update.ini

    - name: Build and Publish
      run: |
        dotnet publish MangaUnhost/MangaUnhost.csproj -c Release -r win-x64 --self-contained false -o publish -p:Version=${{ env.VERSION }}

    - name: Package Artifacts
      shell: python
      run: |
        import os
        import shutil
        import zipfile

        pub_dir = 'publish'
        cef_root = 'cef_pack'
        cef_dir = os.path.join(cef_root, 'runtimes', 'win-x64', 'native')
        native_dir = 'native_pack'
        app_dir = 'app_pack'

        os.makedirs(cef_dir, exist_ok=True)
        os.makedirs(native_dir, exist_ok=True)
        os.makedirs(app_dir, exist_ok=True)

        # 1. NativeLibs
        os.makedirs(os.path.join(native_dir, 'x64'), exist_ok=True)
        os.makedirs(os.path.join(native_dir, 'x86'), exist_ok=True)
        
        native_libs = {
            "LibAPNG.dll": ".",
            "cvextern.dll": ".",
            "dxcompiler.dll": ".",
            "opencv_videoio_ffmpeg481_64.dll": ".",
            "libwebp.dll": "x64",
            "libwebp_x64.dll": "x64/libwebp.dll",
            "libwebp_x86.dll": "x86/libwebp.dll"
        }
        
        for lib, dest in native_libs.items():
            src = os.path.join(pub_dir, lib)
            if os.path.exists(src):
                if dest == ".":
                    shutil.move(src, native_dir)
                else:
                    dst_path = os.path.join(native_dir, dest)
                    if dest.endswith(".dll"):
                        shutil.move(src, dst_path)
                    else:
                        shutil.move(src, os.path.join(dst_path, lib))
        
        with zipfile.ZipFile('NativeLibs.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
            for root, _, files in os.walk(native_dir):
                for f in files:
                    file_path = os.path.join(root, f)
                    zf.write(file_path, os.path.relpath(file_path, native_dir))

        chunk_size = 50 * 1024 * 1024
        
        native_size = os.path.getsize('NativeLibs.zip')
        
        def split_zip(zip_path):
            with open(zip_path, 'rb') as f:
                part = 0
                while True:
                    data = f.read(chunk_size)
                    if not data:
                        break
                    with open(f'{zip_path}.{part:03d}', 'wb') as chunk_file:
                        chunk_file.write(data)
                    part += 1
            os.remove(zip_path)
            
        split_zip('NativeLibs.zip')

        # 2. CEF
        cef_files = [
            "libcef.dll", "libEGL.dll", "libGLESv2.dll", "chrome_elf.dll",
            "d3dcompiler_47.dll", "vk_swiftshader.dll", "vulkan-1.dll",
            "snapshot_blob.bin", "v8_context_snapshot.bin", "icudtl.dat",
            "chrome_100_percent.pak", "chrome_200_percent.pak", "resources.pak"
        ]
        for f in cef_files:
            src = os.path.join(pub_dir, f)
            if os.path.exists(src):
                shutil.move(src, cef_dir)
        
        cef_managed_files = [
            "CefSharp.dll", "CefSharp.Core.dll", "CefSharp.Core.Runtime.dll", 
            "CefSharp.WinForms.dll", "CefSharp.OffScreen.dll",
            "CefSharp.BrowserSubprocess.exe", "CefSharp.BrowserSubprocess.Core.dll",
            "CefSharp.BrowserSubprocess.dll", "CefSharp.BrowserSubprocess.runtimeconfig.json"
        ]
        for f in cef_managed_files:
            src = os.path.join(pub_dir, f)
            if os.path.exists(src):
                shutil.move(src, cef_root)
        
        # Locales
        locales_src = os.path.join(pub_dir, 'locales')
        if os.path.exists(locales_src):
            locales_dst = os.path.join(cef_dir, 'locales')
            os.makedirs(locales_dst, exist_ok=True)
            en_us_pak = os.path.join(locales_src, 'en-US.pak')
            if os.path.exists(en_us_pak):
                shutil.move(en_us_pak, locales_dst)
            shutil.rmtree(locales_src, ignore_errors=True)

        # SwiftShader
        swift_src = os.path.join(pub_dir, 'swiftshader')
        if os.path.exists(swift_src):
            shutil.move(swift_src, cef_dir)

        # We will use a static CEF version name or read from somewhere
        cef_version = "v149.0.60" # Use dynamic parsing if needed later
        cef_zip_name = f'CEFx64-{cef_version}.zip'
        with zipfile.ZipFile(cef_zip_name, 'w', zipfile.ZIP_DEFLATED) as zf:
            for root, _, files in os.walk(cef_root):
                for f in files:
                    file_path = os.path.join(root, f)
                    zf.write(file_path, os.path.relpath(file_path, cef_root))

        cef_size = os.path.getsize(cef_zip_name)
        split_zip(cef_zip_name)

        # 3. App Core Zip
        for item in os.listdir(pub_dir):
            shutil.move(os.path.join(pub_dir, item), app_dir)

        with zipfile.ZipFile('update.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
            for root, _, files in os.walk(app_dir):
                for f in files:
                    file_path = os.path.join(root, f)
                    zf.write(file_path, os.path.relpath(file_path, app_dir))

        app_size = os.path.getsize('update.zip')

        # 4. Split App Core Zip
        split_zip('update.zip')
        
        version_str = "${{ env.VERSION }}"
        if not version_str or version_str == "":
            version_str = "10.0.0"

        # 5. Generate update.ini
        with open('update.ini', 'w') as f:
            f.write('[Updater]\n')
            f.write(f'Version={version_str}\n')
            f.write(f'AppSize={app_size}\n')
            f.write(f'CefSize={cef_size}\n')
            f.write(f'NativeSize={native_size}\n')

    - name: Upload Core Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MangaUnhost-Core
        path: app_pack/

    - name: Deploy to Data Branch
      if: github.event_name == 'push' && github.ref == 'refs/heads/master-dotnet10'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Mover os artefatos para fora do repo antes do checkout
        mkdir -p ../artifacts
        Move-Item -Path "update.ini" -Destination "../artifacts/" -Force
        Move-Item -Path "update.zip.*" -Destination "../artifacts/" -Force
        Move-Item -Path "CEFx64*.zip.*" -Destination "../artifacts/" -Force
        Move-Item -Path "NativeLibs.zip.*" -Destination "../artifacts/" -Force
        
        git fetch origin data:data
        git checkout data
        
        # Mover de volta para o repo (branch data)
        # Primeiro, removemos os arquivos do index do git para garantir que antigas partes sejam excluídas
        git rm --ignore-unmatch update.ini update.zip.* CEFx64*.zip.* NativeLibs.zip.* -r -f
        Remove-Item -Path "update.ini", "update.zip.*", "CEFx64*.zip.*", "NativeLibs.zip.*" -Force -ErrorAction SilentlyContinue
        Move-Item -Path "../artifacts/*" -Destination "." -Force
        
        # Adicionar apenas os artefatos de update (evitando add -A que inclui submodulos como titanium-web-proxy)
        git add update.ini update.zip.* CEFx64*.zip.* NativeLibs.zip.*
        $changes = git status --porcelain
        if ($changes) {
            git commit --amend -m "Auto-build Update"
            if ($LASTEXITCODE -ne 0) {
                git commit -m "Auto-build Update"
            }
            git push origin data --force
        } else {
            Write-Host "No changes to commit."
        }
